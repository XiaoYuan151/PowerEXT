name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: PowerEXT
          - os: ubuntu-latest
            artifact: PowerEXT
          - os: windows-latest
            artifact: PowerEXT.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: PowerEXT-${{ matrix.os }}
          path: target/release/${{ matrix.artifact }}
